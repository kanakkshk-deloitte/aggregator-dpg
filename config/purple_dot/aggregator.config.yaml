# Active aggregator config for the running stack. Switched to purple_dot
# for the PWD-services rollout; the same docker image runs blue_dot,
# yellow_dot, or any other signalstack network by editing only this file.
# Treat as deploy state; the .example.yaml sibling documents every
# supported field.

aggregator:
  name: Purple Dots Aggregator
  contact_email: ops@purpledots.local

  network:
    # Pin to a tag in production; develop is fine for local iteration.
    source: https://raw.githubusercontent.com/kanakkshk-deloitte/uploadable-files/refs/heads/main/network.json
    # Purple_dot schemas have array-typed fields (disability_type,
    # looking_for, documents_available) — bulk CSV cells use `|` as the
    # delimiter.
    csv_array_delimiter: '|'
    field_overrides:
      person_with_disability:
        name: person_name
        phone: mobile_number
        email: email
      service_provider:
        name: contact_name
        phone: contact_phone
        email: contact_email
      employer:
        name: contact_name
        phone: contact_phone
        email: contact_email
      ngo:
        name: contact_name
        phone: contact_phone
        email: contact_email
      government:
        name: nodal_officer_name
        phone: nodal_officer_phone
        email: nodal_officer_email

  brand:
    short_name: Purple Dots
    long_name: Purple Dot Aggregator Portal
    tagline: Discovery & services network for People with Disabilities
    url_slug: purple-dots
    # Canonical hex from Purple Dots Brand Guidelines (see brand.json).
    # Purple 700 (deep) for CTAs — AAA contrast on white text.
    primary_color: '#4c29c3'
    accent_color: '#a176e4'

  domain_labels:
    person_with_disability:
      singular: Person with Disability
      plural: Persons with Disabilities
      tab_label: Persons with Disabilities
    service_provider:
      singular: Service Provider
      plural: Service Providers
      tab_label: Providers
    employer:
      singular: Employer
      plural: Employers
      tab_label: Employers
    ngo:
      singular: NGO
      plural: NGOs
      tab_label: NGOs
    government:
      singular: Government
      plural: Government Profiles
      tab_label: Government

  onboarding:
    presume_consent: true
    bulk_max_rows: 10000

  # Per-link registration modes. Each key names an admin-facing channel.
  # `submission_shape` decides what the public form renders:
  #   - account_only        : MinimalIdentityForm (name + phone OR email + consent).
  #   - account_and_profile : full RJSF profile schema; partial submissions accepted.
  # `public_hint_i18n_key` is the i18n key rendered beneath the form;
  # null means no hint.
  registration_modes:
    voice:
      label_i18n_key: registration_mode.voice.label
      submission_shape: account_only
      public_hint_i18n_key: registration_mode.voice.hint
    form:
      label_i18n_key: registration_mode.form.label
      submission_shape: account_and_profile
      public_hint_i18n_key: null

  admin_emails:
    - abhishekg@sanketika.in
